<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>从一个问题，到一条知识视频</title>
<style>
:root{color-scheme:dark;--ink:#111b22;--paper:#f6f1e9;--muted:#91a3ab;--mint:#9ee3cf;--peach:#ffa886}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e12;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--ink);color:var(--paper);transform-origin:0 0}
.noise{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 22%,#22443b55,transparent 48%),radial-gradient(ellipse at 10% 80%,#71433125,transparent 45%);pointer-events:none}
.header{position:absolute;left:8%;right:8%;top:4.5%;display:flex;align-items:center;justify-content:space-between;font-size:20px;letter-spacing:4px;color:#9aacae}
.header b{font-weight:500;color:#e4e7df}.header .dot{display:inline-block;width:9px;height:9px;background:var(--mint);border-radius:50%;margin-right:16px}.folio{font-variant-numeric:tabular-nums;font-size:18px;letter-spacing:2px}
.scene{position:absolute;left:8%;right:8%;top:15%;height:51%;display:none}.scene.active{display:block}.kicker{color:var(--mint);font-size:21px;letter-spacing:5px;margin-bottom:25px}.headline{font-weight:800;font-size:82px;line-height:1.22;letter-spacing:-3px;margin:0;max-width:100%}.headline em{color:var(--peach);font-style:normal}.lead{color:#b4c0c2;font-size:27px;line-height:1.75;letter-spacing:1px;margin-top:24px}.visual{margin-top:50px;position:relative;min-height:290px}.rule{height:1px;background:#78938b40;margin:32px 0}.muted{color:#8fa2a8}.small{font-size:21px;line-height:1.7}.accent{color:var(--mint)}
.orbit{height:350px;position:relative}.orbit .core{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px;border:1px solid #9ee3cf88;border-radius:50%;display:grid;place-items:center;font-size:39px;font-weight:700;box-shadow:0 0 100px #9ee3cf0c}.ring{position:absolute;width:340px;height:340px;border:1px dashed #688e7a55;border-radius:50%;left:50%;top:50%;margin:-170px}.node{position:absolute;background:#20322f;border:1px solid #52776b;border-radius:50px;padding:15px 24px;font-size:26px;white-space:nowrap}.node.a{left:3%;top:20%}.node.b{right:1%;top:20%}.node.c{left:36%;bottom:0}.orbit svg{position:absolute;inset:0;width:100%;height:100%}
.question{border-left:5px solid var(--peach);padding:12px 0 12px 30px;font-size:39px;font-weight:600;line-height:1.6}.answer{margin-top:32px;display:flex;align-items:center;gap:20px;color:var(--mint);font-size:26px}.arrow{height:1px;width:70px;background:var(--mint)}
.cloud{position:relative;height:180px}.chip{position:absolute;color:#81938f;border:1px solid #53675e66;border-radius:80px;padding:12px 26px;font-size:24px}.chip:nth-child(1){left:0;top:4px}.chip:nth-child(2){left:43%;top:0}.chip:nth-child(3){left:12%;top:88px}.chip:nth-child(4){left:60%;top:85px}.focus-line{border-top:1px solid #62776e55;padding-top:32px;display:flex;gap:24px;align-items:baseline;font-size:42px;font-weight:700}.focus-line .one{font-size:100px;color:var(--peach);font-family:Arial,sans-serif;font-weight:400;line-height:1}
.papers{height:310px;position:relative}.paper{position:absolute;width:290px;height:220px;background:var(--paper);color:#1b2e2a;padding:28px;border-radius:6px;box-shadow:0 16px 45px #0005}.paper:nth-child(1){left:0;top:36px;transform:rotate(-8deg)}.paper:nth-child(2){left:28%;top:13px;transform:rotate(4deg);background:#d2dfd4}.paper:nth-child(3){right:0;top:62px;transform:rotate(9deg);background:#9ee3cf}.paper .line{height:5px;background:#28483b33;margin-top:17px;width:90%}.paper .line.short{width:63%}.paper b{font-size:28px}.seal{position:absolute;right:12px;bottom:10px;border:2px solid #25493b88;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;font-size:20px;transform:rotate(-12deg)}
.translation{display:flex;flex-direction:column;gap:26px}.before{font-size:29px;color:#8f9f9d;text-decoration:line-through;text-decoration-color:#ffad8766}.after{font-size:42px;line-height:1.5;color:var(--mint);font-weight:700}.example{margin-top:27px;border-left:2px solid #78918a;padding-left:23px;font-size:25px;line-height:1.65;color:#b8c7c4}
.structure{display:flex;flex-direction:column;gap:16px}.step{display:flex;align-items:center;gap:27px;padding:22px 0;border-bottom:1px solid #78918a44}.step .num{font-family:Arial,sans-serif;color:var(--mint);font-size:24px;width:35px}.step b{font-size:32px;font-weight:600}.step .hint{font-size:23px;color:#8fa39e;margin-left:auto}
.wave{display:flex;gap:8px;align-items:center;height:130px;justify-content:center;border-top:1px solid #68897c55;border-bottom:1px solid #68897c55}.bar{width:7px;border-radius:6px;background:var(--mint);height:35px}.voice-line{margin-top:34px;display:flex;gap:16px;align-items:center;justify-content:space-between;font-size:26px}.voice-line .tag{padding:12px 18px;border:1px solid #628b7c66;border-radius:5px;color:#b8d4ca}.voice-line .tag:last-child{background:#9ee3cf;color:#173c31}
.checklist{display:flex;flex-direction:column;gap:22px}.check{display:flex;gap:25px;align-items:center;font-size:35px;padding:20px 0;border-bottom:1px solid #78918a44}.tick{width:38px;height:38px;border:1px solid var(--mint);border-radius:50%;display:grid;place-items:center;color:var(--mint);font-size:24px}
.tracks{position:relative;padding:12px 0 20px}.track{display:flex;align-items:center;gap:20px;margin:23px 0}.track label{font-size:22px;color:#b9cac4;width:55px}.lane{height:39px;border-radius:5px;background:#2c4039;flex:1;display:flex;gap:6px;overflow:hidden}.clip{height:100%;border-radius:4px;background:#9ee3cf55;flex:1}.track:nth-child(2) .clip{background:#ffa88677}.track:nth-child(3) .clip{background:#d8dcca77}.playhead{position:absolute;left:15%;top:10px;height:210px;width:2px;background:var(--paper);box-shadow:0 0 14px #f6f1e966}.playhead:before{content:"";position:absolute;left:-5px;top:-3px;width:12px;height:12px;background:var(--paper);transform:rotate(45deg)}
.finish{display:flex;align-items:center;gap:30px}.file{width:185px;height:235px;border:2px solid var(--mint);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;color:var(--mint);flex-shrink:0}.file svg{width:52px}.file b{font-size:35px;font-family:Arial,sans-serif}.finish .benefit{font-size:32px;line-height:1.75;color:#c3d0ca}.finish .benefit strong{font-weight:700;color:var(--peach)}
#avatar{position:absolute;border:1px solid #526d63;background:#192d27;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}#avatar svg{height:55%;width:65%;fill:none;stroke:#9ee3cf;stroke-width:1.7}#avatar span{font-size:17px;color:#aac5b8;letter-spacing:2px}.avatar-meter{display:flex;height:10px;gap:4px;align-items:center}.avatar-meter i{width:3px;background:#9ee3cf;border-radius:3px;height:7px}
#subtitle{position:absolute;left:8%;right:8%;text-align:center;font-weight:600;line-height:1.5;letter-spacing:1px;color:white;text-shadow:0 2px 5px #0009;white-space:normal;text-wrap:balance;overflow-wrap:normal;word-break:normal;line-break:strict;transform:translateY(-100%)}#subtitle .caption{display:inline;padding:6px 12px;background:#0a121bcc;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:6px}
.footer{position:absolute;left:8%;right:8%;bottom:3.5%;display:flex;align-items:center;gap:20px;color:#78928a;font-size:17px}.progress{height:2px;background:#385047;flex:1;position:relative}.progress i{display:block;background:var(--mint);height:100%;width:0}.footer .time{font-family:Arial,sans-serif;width:48px;text-align:right;font-size:16px}
.landscape .scene{top:20%;height:58%;display:none;grid-template-columns:1fr 1.05fr;gap:7%;align-items:center;right:18%}.landscape .scene.active{display:grid}.landscape .headline{font-size:60px}.landscape .kicker{font-size:18px;margin-bottom:20px}.landscape .lead{font-size:23px}.landscape .visual{margin-top:0;min-height:250px}.landscape .orbit{height:320px}.landscape .header{font-size:17px;top:6%}.landscape .question{font-size:31px}.landscape .paper{width:210px;height:200px;padding:22px}.landscape .paper b{font-size:23px}.landscape .seal{width:60px;height:60px;font-size:17px}.landscape .after{font-size:33px}.landscape .example{font-size:22px}.landscape .step b{font-size:27px}.landscape .step .hint{font-size:21px}.landscape .voice-line{font-size:20px}.landscape .voice-line .tag{padding:10px}.landscape .finish .benefit{font-size:26px}.landscape .file{width:145px;height:190px}.landscape .check{font-size:28px}.landscape .focus-line{font-size:34px}.landscape .chip{font-size:18px;padding:10px 17px}.landscape .node{font-size:22px}
#controls{position:fixed;bottom:0;left:0;right:0;background:#1e2c2d;padding:12px 20px;display:flex;gap:18px;align-items:center;z-index:99}#controls audio{height:36px;width:330px}#seek{flex:1}#controls output{color:#b6d6ca;min-width:50px}.render #controls{display:none}
</style></head><body>
<div id="stage"><div class="noise"></div><header class="header"><b><span class="dot"></span>内容制作笔记</b><span class="folio" id="folio">01 / 10</span></header><main id="scenes"></main>
<aside id="avatar"><svg viewBox="0 0 80 86" aria-label="口播人占位"><circle cx="40" cy="26" r="16"/><path d="M9 78c0-24 13-36 31-36s31 12 31 36"/></svg><span>口播人</span><div class="avatar-meter"></div></aside>
<div id="subtitle"></div><footer class="footer"><span id="chapter">从稿件到成片</span><div class="progress"><i></i></div><span class="time">00:00</span></footer></div>
<div id="controls"><audio controls preload="metadata"></audio><input id="seek" type="range" min="0" max="72" step=".01" value="0"><output>00:00</output></div>
<script>
const $$=(s,r=document)=>[...r.querySelectorAll(s)],$=(s,r=document)=>r.querySelector(s);
const reveal=(key,html,cls='')=>`<div data-key="${key}" class="${cls}">${html}</div>`;
const row=(n,title,hint,key)=>reveal(key,`<span class="num">${n}</span><b data-safe-text>${title}</b><span class="hint">${hint}</span>`,'step');
const templates={
 intro:()=>`<div class="orbit"><svg viewBox="0 0 740 350"><path d="M110 120L370 175 630 120M370 175V310" stroke="#547d6b" fill="none" stroke-width="2"/></svg><div class="ring" data-ring></div><div class="core" data-safe-text>一个话题</div>${reveal('report','调研报告','node a')}${reveal('script','口播稿','node b')}${reveal('video','知识视频','node c')}</div>`,
 question:()=>`${reveal('question','观众看完之后<br>能获得什么？','question')} ${reveal('answer','<i class="arrow"></i><span data-safe-text>先确定一个清楚的问题</span>','answer')}`,
 focus:()=>`<div class="cloud">${['概念','案例','数据','结论'].map((t,i)=>reveal('idea'+i,t,'chip')).join('')}</div>${reveal('one','<span class="one">1</span><span data-safe-text>围绕一个主题讲清楚</span>','focus-line')}`,
 research:()=>`<div class="papers">${['来源','证据','结论'].map((t,i)=>reveal('paper'+i,`<b>${t}</b><div class="line"></div><div class="line short"></div><div class="line"></div>${i===2?'<div class="seal">可核对</div>':''}`,'paper')).join('')}</div>`,
 explain:()=>`<div class="translation">${reveal('before','专业概念 → 理解门槛','before')}${reveal('after','把复杂的事<br>用日常语言讲清楚','after')}${reveal('example','抽象概念，加一个简单例子','example')}</div>`,
 structure:()=>`<div class="structure">${row('01','开头','直接说明问题','opening')}${row('02','中间','解释原因','reason')}${row('03','结尾','给出行动建议','action')}</div>`,
 voice:()=>`<div class="wave">${Array.from({length:40},(_,i)=>`<i class="bar" data-bar="${i}"></i>`).join('')}</div><div class="voice-line">${reveal('reference','参考声音','tag')}${reveal('copy','口播稿','tag')}${reveal('audio','配音','tag')}</div>${reveal('automatic','自动处理参考片段，无需手动裁切','lead small')}`,
 review:()=>`<div class="checklist">${['有没有漏字','有没有读错','停顿是否自然'].map((t,i)=>reveal('check'+i,`<span class="tick">✓</span><span data-safe-text>${t}</span>`,'check')).join('')}</div>`,
 sync:()=>`<div class="tracks">${['声音','字幕','画面'].map((t,i)=>reveal('track'+i,`<label>${t}</label><div class="lane">${Array.from({length:4+i},(_,j)=>`<i class="clip" style="flex:${[1,1.4,.8,1.1][j%4]}"></i>`).join('')}</div>`,'track')).join('')}<i class="playhead"></i></div>${reveal('together','用同一条时间轴，保持同步','lead small')}`,
 finish:()=>`<div class="finish">${reveal('file','<svg viewBox="0 0 60 65"><path d="M15 2h21l12 12v47H12V2zM36 2v14h12" stroke="currentColor" fill="none" stroke-width="2"/><path d="M25 29l13 9-13 9z" fill="currentColor"/></svg><b>MP4</b>','file')}${reveal('benefit','减少重复剪辑<br>把时间留给<br><strong>内容本身</strong>','benefit')}</div>`
};
let bundle=null,active=null,current=0;
const stage=$('#stage'),audio=$('audio'),seek=$('#seek');
function configure(data){bundle=data;const p=data.profile.data,w=p.width,h=p.height,portrait=h>=w;bundle.base=portrait?{w:900,h:1600}:{w:1600,h:900};stage.style.width=bundle.base.w+'px';stage.style.height=bundle.base.h+'px';stage.classList.toggle('landscape',!portrait);stage.style.fontFamily=p.subtitle_style.font_family+', "Microsoft YaHei", sans-serif';
 $('#scenes').innerHTML=data.visuals.map(s=>`<section class="scene" data-scene-id="${s.id}"><div class="text"><div class="kicker" data-safe-text>${s.kicker}</div><h1 class="headline" data-safe-text>${s.title}</h1>${s.lead?`<p class="lead" data-safe-text>${s.lead}</p>`:''}</div><div class="visual">${templates[s.type]()}</div></section>`).join('');
 const a=p.avatar,avatar=$('#avatar');avatar.style.display=a.enabled?'flex':'none';Object.assign(avatar.style,{left:a.x*bundle.base.w+'px',top:a.y*bundle.base.h+'px',width:a.width*bundle.base.w+'px',height:a.height*bundle.base.h+'px'});$('.avatar-meter').innerHTML='<i></i>'.repeat(9);
 const sub=$('#subtitle');sub.style.top=(1-p.subtitle_style.bottom_margin_ratio)*bundle.base.h+'px';sub.style.fontSize=p.subtitle_style.font_size*(bundle.base.w/p.width)+'px';sub.style.color=p.subtitle_style.color;
 seek.max=data.timeline.data.duration_samples/data.timeline.data.sample_rate;if(data.audio_url&&!document.body.classList.contains('render'))audio.src=data.audio_url;active=null;resize();renderAt(0);return true;}
function resize(){if(!bundle)return;const available=innerHeight-(document.body.classList.contains('render')?0:60);const scale=Math.min(innerWidth/bundle.base.w,available/bundle.base.h);stage.style.transform=`scale(${scale})`;stage.style.left=(innerWidth-bundle.base.w*scale)/2+'px';stage.style.top=(available-bundle.base.h*scale)/2+'px';}
function ease(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)}
function format(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`}
function renderAt(seconds){if(!bundle)return;const tl=bundle.timeline.data,rate=tl.sample_rate,total=tl.duration_samples,sample=Math.max(0,Math.min(total-1,Math.round(seconds*rate)));current=seconds;const index=tl.scenes.findIndex(s=>s.start_sample<=sample&&sample<s.end_sample);if(index<0)throw Error('No scene at requested time');const scene=tl.scenes[index],visual=bundle.visuals[index],node=$(`[data-scene-id="${scene.scene_id}"]`);if(active!==scene.scene_id){$$('.scene').forEach(s=>s.classList.toggle('active',s===node));active=scene.scene_id;}
 const local=(sample-scene.start_sample)/rate,sceneDuration=(scene.end_sample-scene.start_sample)/rate,entry=ease(local/.55);node.style.opacity=.15+.85*entry;node.style.transform=`translateY(${(1-entry)*22}px)`;
 const events=new Map(scene.events.map(e=>[e.target_id,e]));$$('[data-key]',node).forEach((el,i)=>{const event=events.get(el.dataset.key);const at=event?(event.at_sample-scene.start_sample)/rate:.1+i*.13;const x=ease((local-at)/.55);el.style.opacity=.10+.90*x;el.style.translate=`0 ${(1-x)*24}px`;});
 $$('.bar',node).forEach((el,i)=>{el.style.height=(20+Math.abs(Math.sin(seconds*4+i*.7))*65+Math.abs(Math.sin(i*1.3))*24)+'px';el.style.opacity=.35+.65*Math.abs(Math.sin(i*.9+seconds));});
 const ring=$('[data-ring]',node);if(ring)ring.style.transform=`rotate(${local*3}deg)`;const head=$('.playhead',node);if(head)head.style.left=(15+70*Math.min(1,local/Math.max(1,sceneDuration)))+'%';
 $$('.avatar-meter i').forEach((el,i)=>el.style.height=(3+Math.abs(Math.sin(seconds*5+i))*7)+'px');
 const cue=bundle.alignment.data.cues.find(c=>c.start_sample<=sample&&sample<c.end_sample);const sub=$('#subtitle');sub.replaceChildren();if(cue){const span=document.createElement('span');span.className='caption';span.textContent=cue.text;sub.appendChild(span);}$('#folio').textContent=`${String(index+1).padStart(2,'0')} / ${tl.scenes.length}`;$('#chapter').textContent=visual.chapter;$('.progress i').style.width=sample/total*100+'%';$('.time').textContent=format(seconds);seek.value=seconds;$('#controls output').textContent=format(seconds);return {scene_id:scene.scene_id,cue_id:cue?.id||null,time:seconds};}
function inspect(){const rect=stage.getBoundingClientRect(),avatar=$('#avatar').getBoundingClientRect();const nodes=$$('[data-safe-text]', $('.scene.active')).concat($('#subtitle').textContent?[$('#subtitle')]:[]);const issues=[];const headline=$('.headline',$('.scene.active'));const expected=headline.querySelectorAll('br').length+1;if(headline.getBoundingClientRect().height>parseFloat(getComputedStyle(headline).lineHeight)*expected*rect.width/bundle.base.w+2)issues.push({type:'headline_unplanned_wrap',text:headline.textContent});nodes.forEach(el=>{const r=el.getBoundingClientRect();if(r.left<rect.left-1||r.right>rect.right+1||r.top<rect.top-1||r.bottom>rect.bottom+1)issues.push({type:'outside_canvas',text:el.textContent});if(getComputedStyle($('#avatar')).display!=='none'&&r.left<avatar.right&&r.right>avatar.left&&r.top<avatar.bottom&&r.bottom>avatar.top)issues.push({type:'avatar_overlap',text:el.textContent});});return {issues,scene_id:active,width:bundle.profile.data.width,height:bundle.profile.data.height,time:current};}
document.body.classList.toggle('render',new URLSearchParams(location.search).has('render'));addEventListener('resize',resize);seek.oninput=()=>{audio.currentTime=Number(seek.value);renderAt(Number(seek.value));};audio.addEventListener('timeupdate',()=>{if(!document.body.classList.contains('render'))renderAt(audio.currentTime)});function previewLoop(){if(!audio.paused)renderAt(audio.currentTime);requestAnimationFrame(previewLoop)}requestAnimationFrame(previewLoop);
window.CodoopCast={configure,renderAt,inspect,ready:document.fonts.ready};
</script>
<!-- CAST_BUNDLE -->
</body></html>
